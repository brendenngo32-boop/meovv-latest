<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MEOVV Marker — Watermark studio</title><meta name="description" content="A MEOVV-inspired watermark studio. Add text or logos to photos privately in your browser."><link rel="stylesheet" href="style.css?v=mobile-cat-4"></head><body><header><a href="./" class="brand">M<span>E</span>OVV<span class="subbrand"> / MARKER</span></a></header><main><div class="studio"><aside><section id="panel-mark" class="mobile-panel"><h2><b>01</b> Your watermark</h2><div class="tabs"><button class="active" data-mode="text">Text</button><button data-mode="logo">Image / logo</button></div><div id="text-options"><label for="watermark">Signature</label><input id="watermark" value="MEOVV" maxlength="100"><div class="row"><select id="font" aria-label="Font"><option value="sans-serif">Modern sans</option><option value="serif">Editorial serif</option><option value="monospace">Monospace</option></select><input type="color" id="color" value="#ffffff" aria-label="Text color"></div></div><div id="logo-options" hidden><label class="drop">＋ Add logos<input id="logos" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" multiple hidden></label><div id="logo-list"></div></div><label class="check"><input type="checkbox" id="remember" checked> Remember my watermark</label></section><section id="panel-photos" class="mobile-panel mobile-active"><h2><b>02</b> Your photos <span id="count">0 / 20</span></h2><label class="drop" id="photo-drop"><span>＋ &nbsp; Drop photos or <u>browse</u></span><small>JPG, PNG, WebP · up to 20 photos</small><input type="file" id="photos" accept="image/jpeg,image/png,image/webp" multiple hidden></label></section><section id="panel-adjust" class="mobile-panel"><h2><b>03</b> Make it fit</h2><div class="tabs"><button class="active" data-layout="single">Single</button><button data-layout="scatter">Scattered</button></div><div class="position-row"><div id="positions" aria-label="Watermark position"></div><small>Choose a position.<br>Or drag on your photo.</small></div><label class="range-label" for="size">Size <output id="size-out">25%</output></label><input id="size" type="range" min="5" max="80" value="25"><label class="range-label" for="opacity">Opacity <output id="opacity-out">60%</output></label><input id="opacity" type="range" min="5" max="100" value="60"><label class="range-label" for="rotation">Rotation <output id="rotation-out">0°</output></label><input id="rotation" type="range" min="-180" max="180" value="0"></section><section id="panel-save" class="mobile-panel"><h2><b>04</b> Take it with you</h2><div class="row"><select id="format" aria-label="Download format"><option value="original">Original format</option><option value="png">PNG</option><option value="jpeg">JPG</option><option value="webp">WebP</option></select><label class="quality">Quality <input id="quality" type="number" min="1" max="100" value="92"></label></div><button id="download" class="primary" disabled>Download image &nbsp; ↗</button><button id="download-all" class="secondary" disabled>Download all as ZIP</button></section></aside><article class="workspace"><div class="preview-top"><span><i></i> LIVE PREVIEW</span><span id="dimensions"></span></div><div id="canvas-wrap"><div id="empty"><div class="cat">/\_/\<br>( • . • )<br> / &gt; ♡</div><h3>A mark of your own.</h3><button id="upload-start" class="mobile-upload primary">＋ Choose your photos</button></div><canvas id="preview" hidden aria-label="Watermarked image preview"></canvas></div><div class="preview-bottom"><span id="filename">NO PHOTO SELECTED</span><button id="remove" hidden>Remove photo ×</button></div><div id="thumbnails"></div></article></div><div id="status" role="status" aria-live="polite"></div></main><script src="app.js?v=no-sample-3"></script></body></html>
