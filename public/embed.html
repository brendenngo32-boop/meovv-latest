<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Video Embed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <div id="video-wrapper" class="click-to-play-container player" onclick="activatePlayer()">
            <img src="card.png" alt="Video Preview" class="preview-thumb">
            <div class="play-btn">
                <svg viewBox="0 0 24 24" width="48" height="48">
                    <path fill="#ffffff" d="M8 5v14l11-7z"/>
                </svg>
            </div>
        </div>
    </main>

    <script>
        // Function to extract a video ID dynamically from the URL parameters (e.g., ?v=VIDEO_ID)
        function getVideoIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            // Defaults to a fallback ID if none is provided in the URL
            return params.get('v') || 'dQw4w9WgXcQ'; 
        }

        function activatePlayer() {
            const wrapper = document.getElementById('video-wrapper');
            const videoId = getVideoIdFromUrl();
            
            // Replaces the preview container with the live iframe using the dynamic video ID
            wrapper.innerHTML = `
                <iframe 
                    src="https://www.youtube.com/embed/${videoId}?autoplay=1" 
                    title="Video player" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            `;
            wrapper.classList.add('is-playing');
        }
    </script>
</body>
</html>
