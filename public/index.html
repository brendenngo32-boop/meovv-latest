<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEOVV Latest Video</title>
    <link rel="stylesheet" href="style.css">

    <!-- Open Graph Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="MEOVV's Latest Video">
    <meta property="og:description" content="Watch the latest release from MEOVV.">
    <meta property="og:image" content="__SITE_URL__/card.png">
    <meta property="og:url" content="__SITE_URL__/">

    <!-- X (Twitter) Card Meta Tags (Forces Large Image Preview Card) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="MEOVV's Latest Video">
    <meta name="twitter:description" content="Watch the latest release from MEOVV.">
    <meta name="twitter:image" content="__SITE_URL__/card.png">
</head>
<body>

    <main>
        <header>
            <a class="wordmark" href="./">MEOVV</a>
            <div class="era">
                <strong>LATEST</strong>
                <span>OFFICIAL YOUTUBE</span>
            </div>
        </header>

        <section class="intro">
            <h1>Latest Upload</h1>
            <div class="channel">@MEOVV_OFFICIAL</div>
        </section>

        <!-- Player Container -->
        <div class="player" id="player">
            <p role="status">Loading MEOVV's latest video...</p>
        </div>

        <div class="details">
            <div>
                <p class="eyebrow" id="published">LATEST UPLOAD</p>
                <h2 id="title">Loading latest video...</h2>
            </div>
            <a id="watch" class="watch" href="https://www.youtube.com/@MEOVV_OFFICIAL" target="_blank" rel="noopener">Watch on YouTube &rarr;</a>
        </div>

        <p class="status" id="status" role="status"></p>
    </main>

    <script src="app.js"></script>
</body>
</html>
