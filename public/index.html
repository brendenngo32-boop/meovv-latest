<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEOVV Latest Video</title>
    <link rel="stylesheet" href="style.css">

    <!-- Open Graph Meta Tags (For Discord, Slack, iMessage, Facebook) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="MEOVV's Latest Video">
    <meta property="og:description" content="Watch the latest release from MEOVV.">
    <meta property="og:image" content="__SITE_URL__/card.png">
    <meta property="og:url" content="__SITE_URL__/">

    <!-- X (Twitter) Card Meta Tags (Forces clean Large Image Preview) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="MEOVV's Latest Video">
    <meta name="twitter:description" content="Watch the latest release from MEOVV.">
    <meta name="twitter:image" content="__SITE_URL__/card.png">
</head>
<body>

    <main>
        <header>
            <a class="wordmark" href="./">MEOVV</a>
            <div class="era">
                <strong>LATEST</strong>
                <span>OFFICIAL YOUTUBE</span>
            </div>
        </header>

        <section class="intro">
            <h1>Latest Upload</h1>
            <div class="channel">@MEOVV_OFFICIAL</div>
        </section>

        <!-- Click-to-Play Video Wrapper -->
        <div id="video-wrapper" class="click-to-play-container player" onclick="activatePlayer()">
            <img src="card.png" alt="Video Preview" class="preview-thumb">
            <div class="play-btn">
                <svg viewBox="0 0 24 24" width="48" height="48">
                    <path fill="#ffffff" d="M8 5v14l11-7z"/>
                </svg>
            </div>
        </div>

        <div class="details">
            <div>
                <p class="eyebrow" id="published">LATEST UPLOAD</p>
                <h2 id="title">Loading latest video...</h2>
            </div>
            <a id="watch" class="watch" href="https://www.youtube.com/@MEOVV_OFFICIAL" target="_blank" rel="noopener">Watch on YouTube &rarr;</a>
        </div>

        <p class="status" id="status"></p>
    </main>

    <script src="app.js"></script>
    <script>
        function activatePlayer() {
            const wrapper = document.getElementById('video-wrapper');
            // The build script automatically replaces __VIDEO_ID__ with your latest video ID
            const videoId = '__VIDEO_ID__'; 
            
            wrapper.innerHTML = `
                <iframe 
                    src="https://www.youtube.com/embed/${videoId}?autoplay=1" 
                    title="Video player" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            `;
            wrapper.classList.add('is-playing');
        }
    </script>
</body>
</html>
