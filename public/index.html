<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEOVV Latest Video</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <div class="intro">
            <h1>Latest Release</h1>
        </div>

        <!-- Click-to-Play Video Wrapper -->
        <div id="video-wrapper" class="click-to-play-container player" onclick="activatePlayer()">
            <img src="card.png" alt="Video Preview" class="preview-thumb">
            <div class="play-btn">
                <svg viewBox="0 0 24 24" width="48" height="48">
                    <path fill="#ffffff" d="M8 5v14l11-7z"/>
                </svg>
            </div>
        </div>
    </main>

    <script>
        function activatePlayer() {
            const wrapper = document.getElementById('video-wrapper');
            
            // The build script automatically replaces __VIDEO_ID__ with the live ID
            const videoId = '__VIDEO_ID__'; 
            
            wrapper.innerHTML = `
                <iframe 
                    src="https://www.youtube.com/embed/${videoId}?autoplay=1" 
                    title="Video player" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            `;
            wrapper.classList.add('is-playing');
        }
    </script>
</body>
</html>
