<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Meovv App</title>
    <style>
        /* Mobile Reset & Layout Lock */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            position: fixed; /* Prevents mobile rubber-band scrolling and bouncing */
            touch-action: none; /* Disables pinch-to-zoom and unwanted gestures */
        }
        #app, canvas, .container {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <!-- App Container / Root Element -->
    <div id="app"></div>

    <script>
        // Fix for mobile browser dynamic viewport heights (addressing address bar resize issues)
        function setMobileViewport() {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }
        window.addEventListener('resize', setMobileViewport);
        window.addEventListener('orientationchange', setMobileViewport);
        setMobileViewport();

        // Unified Pointer Event listener template (handles both mouse clicks and mobile taps seamlessly)
        window.addEventListener('pointerdown', (e) => {
            const clientX = e.clientX;
            const clientY = e.clientY;
            // Add your interaction handling here if needed
        }, { passive: true });
    </script>

    <!-- Paste your app script or bundle reference below this line -->
    <!-- <script src="app.js"></script> -->
</body>
</html>
